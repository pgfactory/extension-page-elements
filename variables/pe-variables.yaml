pfy-login-code-mail-body:
  de: |
    Hallo %user%,
    
    Sie haben kürzlich einen Login Code angefordert für die Website %url%.
    Der folgende Login Code wird für die nächsten %timeout% Minuten gültig sein:
    
    %code%

    Falls Sie keinen Login Code angefordert haben, können Sie diese E-Mail ignorieren.
    Kontaktieren Sie den %webmaster%, wenn Sie Fragen haben.
    Aus Sicherheitsgründen sollten Sie diese E-Mail bitte NICHT weiterleiten.
  de2: |
    Hallo %user%,
    
    Du hast kürzlich einen Login Code angefordert für die Website %url%.
    Der folgende Login Code wird für die nächsten %timeout% Minuten gültig sein:
    
    %code%

    Falls du keinen Login Code angefordert hast, kannst du diese E-Mail ignorieren.
    Kontaktiere den %webmaster%, wenn du Fragen hast.
    Aus Sicherheitsgründen solltest du diese E-Mail bitte NICHT weiterleiten.
  _:  |
    Hi %user%,
    
    You recently requested a login code for the website %url%.
    The following login code will be valid for %timeout% minutes:
    
    %code%
    
    If you did not request a login code, please ignore this email or contact your administrator if you have questions.
    For security, please DO NOT forward this email.

pfy-login-pw-reset-mail-body:
  de: |
    Hallo %user%,
    
    Sie haben kürzlich einen Passwort Reset angefordert für die Website %url%.
    Der folgende Passwort Reset Code wird für die nächsten %timeout% Minuten gültig sein:
    
    %code%

    Falls Sie keinen Passwort Reset angefordert haben, können Sie diese E-Mail ignorieren.
    Kontaktieren Sie den %webmaster%, wenn Sie Fragen haben.
    Aus Sicherheitsgründen sollten Sie diese E-Mail bitte NICHT weiterleiten.
  de2: |
    Hallo %user%,
    
    Du hast kürzlich einen Passwort Reset angefordert für die Website %url%.
    Der folgende Passwort Reset Code wird für die nächsten %timeout% Minuten gültig sein:
    
    %code%

    Falls du keinen Passwort Reset angefordert hast, kannst du diese E-Mail ignorieren.
    Kontaktiere den %webmaster%, wenn du Fragen hast.
    Aus Sicherheitsgründen solltest du diese E-Mail bitte NICHT weiterleiten.
  _:  |
    Hi %user%,
    
    You recently requested a password reset code for the website %url%.
    The following password reset code will be valid for %timeout% minutes:
    
    %code%
    
    If you did not request a password reset code, please ignore this email or contact your administrator if you have questions.
    For security, please DO NOT forward this email.

