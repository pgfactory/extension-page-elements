# === Confirmation Email Templates (sent to enlisted people):
pfy-enlist-add-visitor-confirmation-subject:
  de: 'Einschreibeliste "%title%" (%host%)'
  _: 'Entry list "%title%" (%host%)'

pfy-enlist-add-visitor-confirmation-message:
  de: |
    Hallo %name%
    
    Sie sind jetzt eingetragen in die Liste "%title%" auf Seite %page%.
    
    Gruss von der Website

  de2: |
    Hallo %name%
    
    Du bist jetzt eingetragen in die Liste "%title%" auf Seite %page%.
    
    Gruss von der Website

  _: |
    Hello %name%
    
    You are now added to the list "%title%" on page %page%.

    Greetings from the website



pfy-enlist-del-visitor-confirmation-subject:
  de: 'Einschreibeliste "%title%" (%host%)'
  _: 'Entry list "%title%" (%host%)'

pfy-enlist-del-visitor-confirmation-message:
  de: |
    Hallo %name%
    
    Sie sind jetzt gelöscht aus der Liste "%title%" auf Seite %page%.

    Gruss von der Website

  de2: |
    Hallo %name%
    
    Du bist jetzt gelöscht aus der Liste "%title%" auf Seite %page%.

    Gruss von der Website

  _: |
    Hello %name%
    
    You are now removed from the list "%title%" on page %page%.

    Greetings from the website



pfy-enlist-activated-visitor-confirmation-subject:
  de: 'Einschreibeliste "%title%" (%host%)'
  _: 'Entry list "%title%" (%host%)'

pfy-enlist-activated-visitor-confirmation-message:
  de: |
    Hallo %name%
    
    Sie waren als Reserve in der Einschreibeliste 
    
    "%title%" 
    
    eingetragen (auf Seite %page%).

    Sie sind nun in den aktiven Bereich vorgerückt, nachdem eine Position vor Ihnen gelöscht wurde.

    Gruss von der Website

  de2: |
    Hallo %name%
    
    Du warst als Reserve in der Einschreibeliste 
    
    "%title%" 
    
    eingetragen (auf Seite %page%).

    Du bist nun in den aktiven Bereich vorgerückt, nachdem eine Position vor dir gelöscht wurde.

    Gruss von der Website

  _: |
    Hello %name%

    You were registered in a reserve position on the list
    
    "%title%" 
    
    on page %page%.

    Now you have been advanced to an active position, since a position ahead of you has been emptied.

    Greetings from the website




