#===============================================================================
# === Notification Email Templates (sent to webmaster):
pfy-enlist-add-notification-subject:
  de: 'Neuer Eintrag für "%listId%" (%host%)'
  _:  'Newly enlisted for "%listId%" (%host%)'

pfy-enlist-add-notification-message:
  de: |
    %name% ist jetzt eingetragen in die Liste
    
    "%listId%"
    
    auf Seite %page%.

  _: |
    %name% has been added to the list
    
    "%listId%"
    
    on %page%.

pfy-enlist-del-notification-subject:
  de: 'Neue Löschung aus "%listId%" (%host%)'
  _:  'Deleted entry from "%listId%" (%host%)'

pfy-enlist-del-notification-message:
  de: |
    %name% ist jetzt gelöscht von der Liste
    
    "%listId%"
    
    auf Seite %page%.

  _: |
    %name% has been removed from the list
    
    "%listId%"
    
    on page %page%.
  

pfy-enlist-activated-notification-subject:
  de: 'Neue Aktivierung in "%listId%" (%host%)'
  _:  'New activation in "%listId%" (%host%)'

pfy-enlist-activated-notification-message:
  de: |
    %name% wurde aus der Reserve aktiviert in der Liste
    
    "%listId%"
    
    auf Seite %page%.

  _: |
    %name% has been activated on the list \n\n"%listId%" \n\non page %page%.

pfy-enlist-del-activated-notification-subject:
  de: 'Neue Aktivierung in "%listId%" (%host%)'
  _:  'New activation in "%listId%" (%host%)'

pfy-enlist-del-activated-notification-message:
  de: |
    Änderungen in Liste
    
    "%listId%"
    
    auf Seite %page%:
    
    - '%deleted%' wurde aus der Liste gelöscht.
    - '%activated%' wurde stattdessen aktiviert.

  _: |
    Modification of list \n\n"%listId%" \n\non page %page%:
    
    - '%deleted%' has been deleted from the list.
    - '%activated%' has been activated instead.

pfy-enlist-collapse-notification-subject:
  de: 'Einschreibeliste "%listId%" (%host%)'
  _: 'Entry list "%listId%" (%host%)'

pfy-enlist-collapse-notification-message:
  de: |
    Die leeren Listenplätze
    
    "%listId%"
    
    auf Seite %page% wurden jetzt aktiviert:
    %activated%

  _: |
    Empty slogs in list
    
    "%listId%"
    
    on page %page% have been activated:
    %activated%



